server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  mcp:
    enabled: true
    path: "/mcp"

catalog:
  path: "catalog"

workspace:
  path: "workspace"

database:
  url: "sqlite:///./data/database.db"
  logging: false

auth:
  token:
    secret-path: "auth/jwt-secret"
    algorithm: "HS256"
    access_ttl_minutes: 15
    refresh_ttl_days: 30
  admin:
    lab_admin:
      pass-path: "auth/lab_admin-password"

logger:
  name: app
  level: info
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  handlers:
    console: {}
    file:
      path: "app.log"

